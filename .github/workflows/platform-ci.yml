name: Platform CI

on:
  pull_request:
    paths:
      - 'platform/api/**'
      - 'platform/docker-compose.yml'
      - '.github/workflows/platform-ci.yml'
  push:
    branches: [main]
    paths:
      - 'platform/api/**'
      - 'platform/docker-compose.yml'
      - '.github/workflows/platform-ci.yml'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}-platform-api

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r platform/api/requirements.txt

      - name: Check Python syntax
        run: python -m py_compile platform/api/app.py

      - name: Run API tests
        working-directory: platform/api
        run: pytest -q

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: platform/api
          push: true
          tags: '${{ env.IMAGE }}:${{ github.sha }}'

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docker Practice App</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef4f8; color: #17324d; }
    main { max-width: 36rem; margin: 1rem; padding: 2.5rem; border: 1px solid #c9d9e5; border-radius: 12px; background: white; box-shadow: 0 12px 30px #17324d1a; }
    h1 { margin-top: 0; color: #087f8c; }
    code { padding: .2rem .4rem; border-radius: 4px; background: #e5f3f4; }
  </style>
</head>
<body>
  <main>
    <h1>Docker pipeline is working</h1>
    <p>This page is running from a custom Docker image in Kubernetes.</p>
    <p>Build, publish, deploy, and watch this message change.</p>
    <p>Version: <code>v1</code></p>
  </main>
</body>
</html>

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-dev
  namespace: flux-system
spec:
  interval: 1m
  path: ./platform/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: microk8s-docker
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: platform-api
      namespace: platform-dev
    - apiVersion: apps/v1
      kind: Deployment
      name: postgres
      namespace: platform-dev

name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'Dockerfile'
      - '.github/workflows/build-and-deploy.yml'

permissions:
  contents: write
  packages: write

env:
  IMAGE: 'ghcr.io/${{ github.repository }}'

jobs:
  build-publish-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: '${{ env.IMAGE }}:${{ github.sha }}'

      - name: Update Kubernetes image
        shell: bash
        run: |
          sed -i "s|image: .*|image: ${IMAGE}:${GITHUB_SHA}|" components/app.yaml

      - name: Commit Kubernetes image update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Deploy image ${{ github.sha }}"
          file_pattern: components/app.yaml

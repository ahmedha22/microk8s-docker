apiVersion: batch/v1
kind: Job
metadata:
  name: platform-db-migration
  namespace: platform-dev
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: platform-db
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                sleep 2
              done
              PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f /schema/schema.sql
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: platform-schema

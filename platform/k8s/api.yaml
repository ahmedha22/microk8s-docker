apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-api
  template:
    metadata:
      labels:
        app: platform-api
    spec:
      containers:
        - name: api
          image: ghcr.io/ahmedha22/microk8s-docker-platform-api:f2aa2e37e9791a4ac0f2fd9418025ba3180cd378
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: platform-dev
spec:
  type: NodePort
  selector:
    app: platform-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081

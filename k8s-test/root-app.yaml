apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app-umbrella
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ahmedha22/microk8s-docker.git'
    targetRevision: HEAD
    path: components
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: app-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
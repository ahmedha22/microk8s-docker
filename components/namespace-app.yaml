apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespace-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ahmedha22/microk8s-docker
    targetRevision: main
    path: k8s-manifests/namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
